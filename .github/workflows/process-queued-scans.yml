name: Process queued scans

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-next-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Claim and run the next queued scan
        env:
          QUALIO_APP_URL: ${{ secrets.QUALIO_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$QUALIO_APP_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --retry 2 --retry-all-errors \
            --request POST "${QUALIO_APP_URL%/}/api/scan/run" \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Content-Type: application/json" \
            --data '{}'
