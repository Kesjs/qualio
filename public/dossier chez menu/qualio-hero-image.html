<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>Qualio</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#fff}.stage{position:relative;width:1280px;height:720px;overflow:hidden;background:#fff}.image{position:absolute;inset:-5%;background:url('/qualio-hero-feedback-map.png') center/cover no-repeat;animation:slow-pan 12s cubic-bezier(.16,1,.3,1) both}@keyframes slow-pan{0%{transform:scale(1.04) translate3d(-1.2%,.6%,0)}45%{transform:scale(1.09) translate3d(0,-.5%,0)}100%{transform:scale(1.12) translate3d(1.2%,-.8%,0)}}@media(prefers-reduced-motion:reduce){.image{animation:none;transform:scale(1.04)}}
</style>
</head>
<body><main class="stage" aria-label="Animation douce de l’illustration Qualio"><div class="image"></div></main></body>
</html>
