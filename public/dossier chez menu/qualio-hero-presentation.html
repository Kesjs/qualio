<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>Qualio — Une direction plus claire</title>
<style>
:root{--orange:#ee6018;--ink:#0b0b0c;--muted:#62626b;--line:#e6e6ea;--soft:#f6f6f7;--white:#fff}
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:var(--white);font-family:Manrope,Arial,sans-serif;color:var(--ink)}
.stage{position:relative;width:1280px;height:720px;overflow:hidden;background:var(--white)}
.image{position:absolute;inset:0;background:url('/qualio-hero-feedback-map.png') center/cover no-repeat;animation:camera 12s cubic-bezier(.16,1,.3,1) both}
.wash{position:absolute;inset:0;background:rgba(255,255,255,.14);animation:wash 12s ease both}
.caption{position:absolute;left:84px;bottom:72px;max-width:520px;font-size:36px;font-weight:600;line-height:1.08;letter-spacing:-.04em;opacity:0;animation:caption 12s ease both}
.caption strong{display:block;color:var(--orange);font-weight:600;margin-top:6px}
.detail{position:absolute;top:58px;right:74px;max-width:260px;padding:14px 16px;border:1px solid rgba(230,230,234,.95);border-radius:10px;background:rgba(255,255,255,.92);font-size:15px;line-height:1.45;opacity:0;animation:detail 12s ease both}
.detail b{display:block;margin-bottom:4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#c2410c}
.end{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,0);opacity:0;animation:end 12s ease both}
.end-inner{display:flex;flex-direction:column;align-items:center;gap:18px;transform:translateY(14px) scale(.96);animation:end-inner 12s cubic-bezier(.16,1,.3,1) both}
.logo{width:86px;height:86px;border-radius:20px;display:block}
.brand{font-size:42px;font-weight:700;letter-spacing:-.05em}
.tagline{padding:7px 15px;background:#fff1e9;color:var(--orange);font-size:24px;font-weight:600;transform:skewX(-2deg)}
.cta{margin-top:4px;padding:13px 24px;border-radius:8px;background:#c2410c;color:#fff;font-size:16px;font-weight:600}
.sub{font-family:monospace;color:var(--muted);font-size:11px}
@keyframes camera{0%{transform:scale(1.06) translate3d(-1.5%,1%,0)}18%{transform:scale(1.02) translate3d(0,0,0)}72%{transform:scale(1.04) translate3d(1%,0,0)}100%{transform:scale(1.04) translate3d(1%,0,0)}}
@keyframes wash{0%,12%{opacity:0}18%,72%{opacity:1}100%{opacity:.2}}
@keyframes caption{0%,8%{opacity:0;transform:translateY(18px)}16%,52%{opacity:1;transform:none}62%,100%{opacity:0;transform:translateY(-10px)}}
@keyframes detail{0%,22%{opacity:0;transform:translateY(12px)}31%,66%{opacity:1;transform:none}76%,100%{opacity:0}}
@keyframes end{0%,66%{opacity:0;background:rgba(255,255,255,0)}72%,100%{opacity:1;background:rgba(255,255,255,.96)}}
@keyframes end-inner{0%,70%{opacity:0;transform:translateY(14px) scale(.96)}78%,100%{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.image,.wash,.caption,.detail,.end,.end-inner{animation:none}.caption{opacity:0}.detail{opacity:0}.end{opacity:1;background:rgba(255,255,255,.96)}.end-inner{opacity:1;transform:none}}
</style>
</head>
<body><main class="stage" aria-label="Présentation animée de Qualio">
<div class="image"></div><div class="wash"></div>
<p class="caption">Les avis se rassemblent.<strong>Une direction plus claire.</strong></p>
<div class="detail"><b>De l’avis à l’action</b>Qualio repère ce qui revient, relie les sources et fait émerger une piste concrète.</div>
<section class="end"><div class="end-inner"><img class="logo" src="/apple-touch-icon.png" alt="Qualio"><div class="brand">Qualio</div><div class="tagline">Une direction plus claire.</div><div class="cta">Commencer gratuitement →</div><div class="sub">Sans carte bancaire · 50 avis analysés</div></div></section>
</main></body></html>
